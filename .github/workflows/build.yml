   name: build

   on:
     push:
       branches: [main]
       tags: ["v*"]
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     windows:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - name: Install
           run: npm install
         - name: Build
           run: npm run dist:win
         - name: Upload exe
           uses: actions/upload-artifact@v4
           with:
             name: gupsik-jjokji-windows
             path: release/*.exe
         - name: Release
           if: startsWith(github.ref, 'refs/tags/')
           uses: softprops/action-gh-release@v2
           with:
             files: release/*.exe
